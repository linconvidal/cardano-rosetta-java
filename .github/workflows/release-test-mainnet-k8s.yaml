name: Release verification - Mainnet K8s

on:
  workflow_call:
    inputs:
      prerelease_tag:
        required: true
        type: string
      stable_tag:
        required: true
        type: string
      run_upgrade:
        required: true
        type: boolean
      clean_resync:
        required: true
        type: boolean
      source_sha:
        required: true
        type: string

permissions:
  contents: read


env:
  DB_SECRET_NAME: rosetta-db-secret
  DEPLOY_DIR: /home/integration/release-tests/cardano-rosetta-java
  EXPECTED_HOST: zur2-s-d-100.colo2.cf-systems.internal
  EXPECTED_KUBE_SYSTEM_UID: 241a420f-223d-4a5f-bd98-3fb032657d6f
  HELM_RELEASE: rosetta
  NAMESPACE: cardano
  NODE_PVC: node-data-rosetta-cardano-node-0
  POSTGRES_PVC: pg-data-rosetta-postgresql-0

jobs:
  preflight:
    runs-on: [self-hosted, release-mainnet-k8s]
    timeout-minutes: 180
    outputs:
      machine_specs: ${{ steps.machine.outputs.machine_specs }}
    steps:
      - name: Check out workflow support files
        uses: actions/checkout@v4

      - name: Validate K8s runner and cluster identity
        run: |
          set -euo pipefail

          for command in curl git helm jq k3s kubectl lscpu python3 sudo; do
            command -v "$command"
          done
          sudo -n true

          if [[ "$(hostname -f)" != "$EXPECTED_HOST" ]]; then
            echo "Expected runner host $EXPECTED_HOST, found $(hostname -f)."
            exit 1
          fi
          kube_system_uid=$(kubectl get namespace kube-system -o json | jq -r '.metadata.uid')
          if [[ "$kube_system_uid" != "$EXPECTED_KUBE_SYSTEM_UID" ]]; then
            echo "Unexpected K8s cluster identity: $kube_system_uid"
            exit 1
          fi

          test -d "$DEPLOY_DIR/.git"
          kubectl get namespace "$NAMESPACE"

      - name: Validate K8s workload contract
        run: |
          set -euo pipefail
          helm status "$HELM_RELEASE" --namespace "$NAMESPACE"
          kubectl get statefulset \
            "$HELM_RELEASE-cardano-node" \
            "$HELM_RELEASE-postgresql" \
            --namespace "$NAMESPACE"
          kubectl get deployment \
            "$HELM_RELEASE-rosetta-api" \
            "$HELM_RELEASE-yaci-indexer" \
            --namespace "$NAMESPACE"

          api_history=$(kubectl get deployment "$HELM_RELEASE-rosetta-api" \
            --namespace "$NAMESPACE" -o json | jq -r \
            '.spec.template.spec.containers[0].env[] | select(.name == "REMOVE_SPENT_UTXOS") | .value')
          indexer_history=$(kubectl get deployment "$HELM_RELEASE-yaci-indexer" \
            --namespace "$NAMESPACE" -o json | jq -r \
            '.spec.template.spec.containers[0].env[] | select(.name == "REMOVE_SPENT_UTXOS") | .value')
          if [[ "$api_history" != "false" || "$indexer_history" != "false" ]]; then
            echo "K8s release baseline must use full-history mode."
            exit 1
          fi

      - name: Validate K8s database and PVC contract
        run: |
          set -euo pipefail
          secret_key=$(kubectl get secret "$DB_SECRET_NAME" \
            --namespace "$NAMESPACE" -o json | jq -r '.data["db-secret"] // ""')
          if [[ -z "$secret_key" ]]; then
            echo "$DB_SECRET_NAME does not contain a db-secret key."
            exit 1
          fi
          # shellcheck disable=SC2016
          kubectl exec "$HELM_RELEASE-postgresql-0" \
            --namespace "$NAMESPACE" \
            -- sh -c 'PGPASSWORD="$DB_SECRET" psql --username rosetta_db_admin --dbname rosetta-java --command "SELECT 1;"'

          for pvc in "$NODE_PVC" "$POSTGRES_PVC"; do
            instance=$(kubectl get pvc "$pvc" --namespace "$NAMESPACE" \
              -o json | jq -r '.metadata.labels["app.kubernetes.io/instance"]')
            request=$(kubectl get pvc "$pvc" --namespace "$NAMESPACE" \
              -o json | jq -r '.spec.resources.requests.storage')
            if [[ "$instance" != "$HELM_RELEASE" || "$request" != "500Gi" ]]; then
              echo "Unexpected PVC contract for $pvc: instance=$instance request=$request"
              exit 1
            fi
          done

      - name: Validate stable K8s API and images
        env:
          RUN_UPGRADE: ${{ inputs.run_upgrade }}
          STABLE_TAG: ${{ inputs.stable_tag }}
        run: |
          set -euo pipefail
          api_ip=$(kubectl get service "$HELM_RELEASE-rosetta-api" \
            --namespace "$NAMESPACE" -o jsonpath='{.spec.clusterIP}')
          status=$(curl -fsS \
            --header 'Content-Type: application/json' \
            --data '{"network_identifier":{"blockchain":"cardano","network":"mainnet"}}' \
            "http://${api_ip}:8082/network/status")
          synced=$(jq -r '.sync_status.synced // false' <<<"$status")
          stage=$(jq -r '.sync_status.stage // "unavailable"' <<<"$status")
          if [[ "$synced" != "true" || "$stage" != "LIVE" ]]; then
            echo "K8s baseline must be LIVE: synced=$synced stage=$stage"
            exit 1
          fi

          if [[ "$RUN_UPGRADE" == "true" ]]; then
            api_image=$(kubectl get deployment "$HELM_RELEASE-rosetta-api" \
              --namespace "$NAMESPACE" \
              -o jsonpath='{.spec.template.spec.containers[0].image}')
            indexer_image=$(kubectl get deployment "$HELM_RELEASE-yaci-indexer" \
              --namespace "$NAMESPACE" \
              -o jsonpath='{.spec.template.spec.containers[0].image}')
            if [[ "$api_image" != "cardanofoundation/cardano-rosetta-java-api:${STABLE_TAG}" ||
                  "$indexer_image" != "cardanofoundation/cardano-rosetta-java-indexer:${STABLE_TAG}" ]]; then
              echo "K8s baseline images are not the exact stable artifacts."
              echo "api=$api_image indexer=$indexer_image"
              exit 1
            fi

            options=$(curl -fsS \
              --header 'Content-Type: application/json' \
              --data '{"network_identifier":{"blockchain":"cardano","network":"mainnet"}}' \
              "http://${api_ip}:8082/network/options")
            version=$(jq -r '.version.middleware_version' <<<"$options")
            if [[ "$version" != "$STABLE_TAG" ]]; then
              echo "Expected stable middleware $STABLE_TAG, found $version."
              exit 1
            fi
          fi

      - name: Verify release source
        env:
          PRERELEASE_TAG: ${{ inputs.prerelease_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          SOURCE_TAG="${PRERELEASE_TAG%-pre-release}"
          origin_url=$(git -C "$DEPLOY_DIR" remote get-url origin)
          if [[ "$origin_url" != "https://github.com/cardano-foundation/cardano-rosetta-java.git" &&
                "$origin_url" != "git@github.com:cardano-foundation/cardano-rosetta-java.git" ]]; then
            echo "Unexpected deployment clone origin: $origin_url"
            exit 1
          fi

          git -C "$DEPLOY_DIR" fetch --tags --prune origin
          resolved_sha=$(git -C "$DEPLOY_DIR" rev-parse "${SOURCE_TAG}^{commit}")
          if [[ "$resolved_sha" != "$SOURCE_SHA" ]]; then
            echo "Release source mismatch: expected $SOURCE_SHA, found $resolved_sha."
            exit 1
          fi
          git -C "$DEPLOY_DIR" checkout --detach --force "$SOURCE_SHA"
          git -C "$DEPLOY_DIR" reset --hard "$SOURCE_SHA"

      - name: Render and prefetch candidate K8s images
        env:
          PRERELEASE_TAG: ${{ inputs.prerelease_tag }}
        run: |
          set -euo pipefail
          chart="$DEPLOY_DIR/helm/cardano-rosetta-java"
          rendered="/tmp/release-test-k8s-${GITHUB_RUN_ID}.yaml"
          helm dependency build "$chart"
          helm template "$HELM_RELEASE" "$chart" \
            --namespace "$NAMESPACE" \
            --values "$chart/values-k3s.yaml" \
            --set global.network=mainnet \
            --set global.profile=mid \
            --set global.releaseVersion="$PRERELEASE_TAG" \
            --set global.apiImage="cardanofoundation/cardano-rosetta-java-api:${PRERELEASE_TAG}" \
            --set global.indexerImage="cardanofoundation/cardano-rosetta-java-indexer:${PRERELEASE_TAG}" \
            --set global.db.existingSecret="$DB_SECRET_NAME" \
            --set global.storage.cardanoNode.size=500Gi \
            --set global.storage.postgresql.size=500Gi \
            --set rosetta-api.env.removeSpentUtxos=false \
            --set yaci-indexer.env.removeSpentUtxos=false \
            > "$rendered"

          mapfile -t images < <(awk '$1 == "image:" {gsub(/"/, "", $2); print $2}' "$rendered" | sort -u)
          for image in "${images[@]}"; do
            if [[ "$image" == */* ]]; then
              image="docker.io/${image}"
            else
              image="docker.io/library/${image}"
            fi
            sudo k3s ctr images pull "$image"
          done

      - name: Validate projected K8s cleanup space
        run: |
          set -euo pipefail
          free_bytes=$(df --output=avail -B1 /var/lib/rancher/k3s/storage | awk 'NR == 2 {print $1}')
          reclaimable_bytes=0
          for pvc in "$NODE_PVC" "$POSTGRES_PVC"; do
            pv=$(kubectl get pvc "$pvc" --namespace "$NAMESPACE" \
              -o json | jq -r '.spec.volumeName')
            data_path=$(kubectl get pv "$pv" -o json | jq -r '.spec.local.path')
            if [[ "$data_path" != /var/lib/rancher/k3s/storage/* ]]; then
              echo "Unexpected local-path volume location for $pvc: $data_path"
              exit 1
            fi
            # du exits non-zero when a file vanishes mid-traversal on a live
            # deployment, yet still prints a usable total.
            du_output=$(sudo du -sB1 "$data_path") || true
            used_bytes=$(awk '{print $1}' <<<"$du_output")
            if [[ ! "$used_bytes" =~ ^[0-9]+$ ]]; then
              echo "Could not measure $data_path."
              exit 1
            fi
            reclaimable_bytes=$((reclaimable_bytes + used_bytes))
          done

          required_bytes=$((1100 * 1024 * 1024 * 1024))
          projected_bytes=$((free_bytes + reclaimable_bytes))
          if (( projected_bytes < required_bytes )); then
            echo "Projected free space after PVC deletion is below 1100GiB."
            exit 1
          fi
          echo "Candidate K8s images are cached and projected disk is sufficient."

      - name: Validate published Kubernetes baseline
        env:
          STABLE_TAG: ${{ inputs.stable_tag }}
        run: |
          set -euo pipefail
          python3 .github/scripts/compare_release_performance.py \
            --baseline-doc "$DEPLOY_DIR/docs/docs/development/test-results/${STABLE_TAG}/mid_profile/kubernetes.md" \
            --stable-tag "$STABLE_TAG" \
            --allow-missing-baseline \
            --check-baseline-only

      - name: Capture runner configuration
        id: machine
        run: |
          set -euo pipefail
          cpu_model=$(lscpu --json | jq -r '.lscpu[] | select(.field == "Model name:") | .data')
          cores_per_socket=$(lscpu --json | jq -r '.lscpu[] | select(.field == "Core(s) per socket:") | .data')
          sockets=$(lscpu --json | jq -r '.lscpu[] | select(.field == "Socket(s):") | .data')
          physical_cores=$((cores_per_socket * sockets))
          threads=$(nproc)
          while read -r key value _; do
            if [[ "$key" == "MemTotal:" ]]; then
              visible_ram_gib=$(((value + 524288) / 1048576))
              break
            fi
          done < /proc/meminfo
          mapfile -t disk_stats < <(df -BG --output=size,avail /var/lib/rancher/k3s/storage)
          read -r disk_total_gib disk_free_gib <<< "${disk_stats[1]}"
          disk_total_gib=${disk_total_gib%G}
          disk_free_gib=${disk_free_gib%G}
          k3s_version=$(k3s --version | sed -n '1p')
          machine_specs="${threads} vCPUs, ${visible_ram_gib}GB RAM; CPU=${cpu_model}; cores=${physical_cores}; threads=${threads}; visible RAM=${visible_ram_gib}GiB; disk=${disk_total_gib}GiB; free=${disk_free_gib}GiB; environment=${k3s_version}; kernel=$(uname -sr)"
          echo "machine_specs=$machine_specs" >> "$GITHUB_OUTPUT"
          printf "### Mainnet K8s runner\n\n%s\n" "$machine_specs" >> "$GITHUB_STEP_SUMMARY"

  upgrade:
    if: ${{ inputs.run_upgrade }}
    needs: preflight
    runs-on: [self-hosted, release-mainnet-k8s]
    timeout-minutes: 1440
    steps:
      - name: Upgrade K8s to pre-release
        env:
          PRERELEASE_TAG: ${{ inputs.prerelease_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          current_sha=$(git -C "$DEPLOY_DIR" rev-parse HEAD)
          if [[ "$current_sha" != "$SOURCE_SHA" ]]; then
            echo "Deployment clone drifted after preflight."
            exit 1
          fi

          chart="$DEPLOY_DIR/helm/cardano-rosetta-java"
          helm upgrade --install "$HELM_RELEASE" "$chart" \
            --namespace "$NAMESPACE" \
            --create-namespace \
            --values "$chart/values-k3s.yaml" \
            --set global.network=mainnet \
            --set global.profile=mid \
            --set global.releaseVersion="$PRERELEASE_TAG" \
            --set global.apiImage="cardanofoundation/cardano-rosetta-java-api:${PRERELEASE_TAG}" \
            --set global.indexerImage="cardanofoundation/cardano-rosetta-java-indexer:${PRERELEASE_TAG}" \
            --set global.db.existingSecret="$DB_SECRET_NAME" \
            --set global.storage.cardanoNode.size=500Gi \
            --set global.storage.postgresql.size=500Gi \
            --set rosetta-api.env.removeSpentUtxos=false \
            --set yaci-indexer.env.removeSpentUtxos=false

      - name: Wait for upgraded K8s deployment to reach LIVE
        env:
          PRERELEASE_TAG: ${{ inputs.prerelease_tag }}
        run: |
          set -euo pipefail
          api_ip=$(kubectl get service "$HELM_RELEASE-rosetta-api" \
            --namespace "$NAMESPACE" -o jsonpath='{.spec.clusterIP}')
          endpoint="http://${api_ip}:8082"

          payload='{"network_identifier":{"blockchain":"cardano","network":"mainnet"}}'
          deadline=$((SECONDS + 72000))
          attempt=0

          until curl -fs --header 'Content-Type: application/json' --data "$payload" \
                  "$endpoint/network/status" \
                | jq -e '.sync_status.synced and .sync_status.stage == "LIVE"' > /dev/null; do
            (( SECONDS < deadline )) || { echo "Upgraded K8s deployment did not reach LIVE in time."; exit 1; }
            (( ++attempt % 20 )) || echo "Upgraded K8s deployment: still waiting after $((SECONDS / 60))m."
            sleep 60
          done

          version=$(curl -fsS --header 'Content-Type: application/json' --data "$payload" \
            "$endpoint/network/options" | jq -r '.version.middleware_version')
          if [[ "$version" != "${PRERELEASE_TAG%-pre-release}" ]]; then
            echo "Upgraded K8s deployment reports middleware $version, expected ${PRERELEASE_TAG%-pre-release}."
            exit 1
          fi
          echo "Upgraded K8s deployment is LIVE on $version."

          for deployment in rosetta-api yaci-indexer; do
            image=$(kubectl get deployment "$HELM_RELEASE-$deployment" \
              --namespace "$NAMESPACE" \
              -o jsonpath='{.spec.template.spec.containers[0].image}')
            if [[ "$image" != *":${PRERELEASE_TAG}" ]]; then
              echo "Expected $deployment on ${PRERELEASE_TAG}, found ${image:-none}."
              exit 1
            fi
          done

  clean-resync:
    if: ${{ inputs.clean_resync && !cancelled() && needs.preflight.result == 'success' && (needs.upgrade.result == 'success' || needs.upgrade.result == 'failure' || needs.upgrade.result == 'skipped') }}
    needs:
      - preflight
      - upgrade
    runs-on: [self-hosted, release-mainnet-k8s]
    timeout-minutes: 5760
    steps:
      - name: Delete the verified K8s release data
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail

          if [[ "$(hostname -f)" != "$EXPECTED_HOST" ]]; then
            echo "Runner host changed after preflight."
            exit 1
          fi
          current_sha=$(git -C "$DEPLOY_DIR" rev-parse HEAD)
          if [[ "$current_sha" != "$SOURCE_SHA" ]]; then
            echo "Deployment clone drifted after preflight."
            exit 1
          fi
          kube_system_uid=$(kubectl get namespace kube-system -o json | jq -r '.metadata.uid')
          if [[ "$kube_system_uid" != "$EXPECTED_KUBE_SYSTEM_UID" ]]; then
            echo "K8s cluster identity changed after preflight."
            exit 1
          fi
          for pvc in "$NODE_PVC" "$POSTGRES_PVC"; do
            instance=$(kubectl get pvc "$pvc" --namespace "$NAMESPACE" \
              -o json | jq -r '.metadata.labels["app.kubernetes.io/instance"]')
            request=$(kubectl get pvc "$pvc" --namespace "$NAMESPACE" \
              -o json | jq -r '.spec.resources.requests.storage')
            if [[ "$instance" != "$HELM_RELEASE" || "$request" != "500Gi" ]]; then
              echo "PVC contract changed after preflight: $pvc"
              exit 1
            fi
          done

          kubectl scale \
            statefulset/"$HELM_RELEASE-cardano-node" \
            statefulset/"$HELM_RELEASE-postgresql" \
            deployment/"$HELM_RELEASE-rosetta-api" \
            deployment/"$HELM_RELEASE-yaci-indexer" \
            --replicas=0 \
            --namespace "$NAMESPACE"

          helm uninstall "$HELM_RELEASE" \
            --namespace "$NAMESPACE" \
            --wait \
            --timeout 30m

          kubectl delete persistentvolumeclaim \
            "$NODE_PVC" \
            "$POSTGRES_PVC" \
            --namespace "$NAMESPACE" \
            --wait=true

          deadline=$((SECONDS + 600))
          while (( SECONDS < deadline )); do
            free_gb=$(df --output=avail -BG /var/lib/rancher/k3s/storage | awk 'NR == 2 {gsub(/G/, ""); print $1}')
            if (( free_gb >= 1100 )); then
              echo "Disk cleanup completed with ${free_gb}GiB available."
              exit 0
            fi
            echo "Waiting for local-path cleanup: ${free_gb}GiB available."
            sleep 30
          done

          echo "PVC deletion did not recover the projected disk space."
          exit 1

      - name: Install clean K8s pre-release deployment
        env:
          PRERELEASE_TAG: ${{ inputs.prerelease_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          current_sha=$(git -C "$DEPLOY_DIR" rev-parse HEAD)
          if [[ "$current_sha" != "$SOURCE_SHA" ]]; then
            echo "Deployment clone drifted after preflight."
            exit 1
          fi

          chart="$DEPLOY_DIR/helm/cardano-rosetta-java"
          helm upgrade --install "$HELM_RELEASE" "$chart" \
            --namespace "$NAMESPACE" \
            --create-namespace \
            --values "$chart/values-k3s.yaml" \
            --set global.network=mainnet \
            --set global.profile=mid \
            --set global.releaseVersion="$PRERELEASE_TAG" \
            --set global.apiImage="cardanofoundation/cardano-rosetta-java-api:${PRERELEASE_TAG}" \
            --set global.indexerImage="cardanofoundation/cardano-rosetta-java-indexer:${PRERELEASE_TAG}" \
            --set global.db.existingSecret="$DB_SECRET_NAME" \
            --set global.storage.cardanoNode.size=500Gi \
            --set global.storage.postgresql.size=500Gi \
            --set rosetta-api.env.removeSpentUtxos=false \
            --set yaci-indexer.env.removeSpentUtxos=false

      - name: Wait for clean K8s resync to reach LIVE
        env:
          PRERELEASE_TAG: ${{ inputs.prerelease_tag }}
        run: |
          set -euo pipefail
          api_ip=$(kubectl get service "$HELM_RELEASE-rosetta-api" \
            --namespace "$NAMESPACE" -o jsonpath='{.spec.clusterIP}')
          endpoint="http://${api_ip}:8082"

          payload='{"network_identifier":{"blockchain":"cardano","network":"mainnet"}}'
          deadline=$((SECONDS + 259200))
          attempt=0

          until curl -fs --header 'Content-Type: application/json' --data "$payload" \
                  "$endpoint/network/status" \
                | jq -e '.sync_status.synced and .sync_status.stage == "LIVE"' > /dev/null; do
            (( SECONDS < deadline )) || { echo "Clean K8s resync did not reach LIVE in time."; exit 1; }
            (( ++attempt % 20 )) || echo "Clean K8s resync: still waiting after $((SECONDS / 60))m."
            sleep 60
          done

          version=$(curl -fsS --header 'Content-Type: application/json' --data "$payload" \
            "$endpoint/network/options" | jq -r '.version.middleware_version')
          if [[ "$version" != "${PRERELEASE_TAG%-pre-release}" ]]; then
            echo "Clean K8s resync reports middleware $version, expected ${PRERELEASE_TAG%-pre-release}."
            exit 1
          fi
          echo "Clean K8s resync is LIVE on $version."

          for deployment in rosetta-api yaci-indexer; do
            image=$(kubectl get deployment "$HELM_RELEASE-$deployment" \
              --namespace "$NAMESPACE" \
              -o jsonpath='{.spec.template.spec.containers[0].image}')
            if [[ "$image" != *":${PRERELEASE_TAG}" ]]; then
              echo "Expected $deployment on ${PRERELEASE_TAG}, found ${image:-none}."
              exit 1
            fi
          done

  performance:
    if: ${{ needs.clean-resync.result == 'success' }}
    needs:
      - preflight
      - clean-resync
    runs-on: [self-hosted, release-mainnet-k8s]
    timeout-minutes: 720
    steps:
      - name: Check out workflow support files
        uses: actions/checkout@v4

      - name: Run legacy stability test against the K8s ClusterIP
        id: stability
        env:
          MACHINE_SPECS: ${{ needs.preflight.outputs.machine_specs }}
          PRERELEASE_TAG: ${{ inputs.prerelease_tag }}
        run: |
          set -euo pipefail
          for command in ab curl jq kubectl python3; do
            command -v "$command"
          done

          tests_dir="$DEPLOY_DIR/tests/legacy-load-tests"
          api_ip=$(kubectl get service "$HELM_RELEASE-rosetta-api" \
            --namespace "$NAMESPACE" -o jsonpath='{.spec.clusterIP}')
          machine_specs="$MACHINE_SPECS"
          run_log="$tests_dir/release-test-${GITHUB_RUN_ID}.log"

          cd "$tests_dir"
          set +e
          python3 stability_test.py \
            --url="http://${api_ip}:8082" \
            --csv=data/mainnet-data.csv \
            --network=mainnet \
            --release="$PRERELEASE_TAG" \
            --hardware-profile=mid_profile \
            --machine-specs="$machine_specs" \
            --duration=60 \
            --cooldown=60 \
            --sla=1000 \
            --error-threshold=1.0 | tee "$run_log"
          test_status=${PIPESTATUS[0]}
          set -e

          result_dir=$(python3 - "$run_log" <<'PY'
          import pathlib
          import sys

          for line in pathlib.Path(sys.argv[1]).read_text().splitlines():
              prefix = "Creating output directory: "
              if line.startswith(prefix):
                  print(line.removeprefix(prefix))
                  break
          PY
          )
          if [[ -z "$result_dir" ]]; then
            echo "Could not determine stability_test.py output directory."
            # Publish the run log anyway, so the always() upload has a real path
            # and the failure stays diagnosable.
            result_dir="$PWD/failed-run-$GITHUB_RUN_ID"
            mkdir -p "$result_dir"
            mv "$run_log" "$result_dir/github-actions.log"
            echo "result_dir=$result_dir" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          mv "$run_log" "$result_dir/github-actions.log"
          echo "result_dir=$result_dir" >> "$GITHUB_OUTPUT"

          if (( test_status != 0 )); then
            exit "$test_status"
          fi
          test -f "$result_dir/summary_results.csv"

      - name: Compare with the previous stable K8s result
        env:
          PRERELEASE_TAG: ${{ inputs.prerelease_tag }}
          RESULT_DIR: ${{ steps.stability.outputs.result_dir }}
          STABLE_TAG: ${{ inputs.stable_tag }}
        run: |
          set -euo pipefail
          python3 .github/scripts/compare_release_performance.py \
            --baseline-doc "$DEPLOY_DIR/docs/docs/development/test-results/${STABLE_TAG}/mid_profile/kubernetes.md" \
            --stable-tag "$STABLE_TAG" \
            --candidate-dir "$RESULT_DIR" \
            --candidate-tag "$PRERELEASE_TAG" \
            --deployment "Mainnet K8s" \
            --documentation-name kubernetes.md \
            --expected-hardware-profile mid_profile \
            --allow-missing-baseline
          cat "$RESULT_DIR/performance-comparison.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload K8s performance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: mainnet-k8s-performance-${{ inputs.prerelease_tag }}
          path: ${{ steps.stability.outputs.result_dir }}
          if-no-files-found: error
          overwrite: true
          retention-days: 30
